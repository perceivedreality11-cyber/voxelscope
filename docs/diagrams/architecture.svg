<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title description">
  <title id="title">VoxelScope · 系统架构</title><desc id="description">自托管 CT 孔隙分析与团队协作平台</desc>
  <defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#101c2e"/><stop offset="1" stop-color="#080e19"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#738fac"/></marker></defs>
  <style>
    svg { --teal:#64dfc3; --purple:#b4a2ff; font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif; }
    .title { fill:#eff5ff; font-size:42px; font-weight:700; } .subtitle { fill:#a1b5cd; font-size:19px; }
    .lane { fill:#101a2a; stroke:#25364e; } .lane-title { fill:#a3b7d1; font-size:15px; letter-spacing:1px; }
    .card { fill:#152338; stroke:#30435e; } .card-title { fill:#edf4ff; font-size:23px; font-weight:700; }
    .body { fill:#b4c6dd; font-size:17px; } .teal { fill:#64dfc3; font-size:13px; font-weight:700; letter-spacing:1px; }
    .purple { fill:#b4a2ff; font-size:13px; font-weight:700; letter-spacing:1px; }
    .edge { fill:none; stroke:#738fac; stroke-width:2; stroke-linejoin:round; } .edge-label { fill:#8da4be; font-size:12px; }
    .footer { fill:#91a7c1; font-size:16px; } .tag { fill:#64dfc3; font-size:14px; letter-spacing:1px; }
  </style>
  <rect width="1440" height="1000" rx="24" fill="url(#background)"/>
  <rect x="60" y="54" width="5" height="82" rx="2" fill="#64dfc3"/>
  <text x="84" y="91" class="title">VoxelScope · 系统架构</text><text x="84" y="128" class="subtitle">自托管 CT 孔隙分析与团队协作平台</text>
  <rect x="60" y="186" width="384" height="700" rx="22" class="lane"/><text x="80" y="222" class="lane-title">01 / 浏览器</text><rect x="528" y="186" width="384" height="700" rx="22" class="lane"/><text x="548" y="222" class="lane-title">02 / 应用服务器</text><rect x="996" y="186" width="384" height="700" rx="22" class="lane"/><text x="1016" y="222" class="lane-title">03 / 持久化数据</text><g><rect x="80" y="252" width="344" height="174" rx="16" class="card"/>
    <rect x="80" y="270" width="3" height="28" rx="1.5" fill="var(--teal)"/>
    <text x="102" y="282" class="teal">WEB WORKBENCH</text><text x="102" y="315" class="card-title">三维分析工作台</text>
    <text x="102" y="346" class="body">WebGL 点云 / 正交切片</text><text x="102" y="371" class="body">GB 级 RAW 分块 / 区域采样</text><text x="102" y="396" class="body">项目导航 / 图片序列导入</text></g><g><rect x="80" y="480" width="344" height="148" rx="16" class="card"/>
    <rect x="80" y="498" width="3" height="28" rx="1.5" fill="var(--purple)"/>
    <text x="102" y="510" class="purple">ROLE-BASED ACCESS</text><text x="102" y="543" class="card-title">团队与企业空间</text>
    <text x="102" y="574" class="body">管理员 / 分析员 / 查看者</text><text x="102" y="599" class="body">服务端校验企业与角色</text></g><g><rect x="80" y="690" width="344" height="166" rx="16" class="card"/>
    <rect x="80" y="708" width="3" height="28" rx="1.5" fill="var(--teal)"/>
    <text x="102" y="720" class="teal">REVIEW &amp; DELIVERY</text><text x="102" y="753" class="card-title">复核与结果交付</text>
    <text x="102" y="784" class="body">追加复核 / 历史结果</text><text x="102" y="809" class="body">JSON 报告 / CSV / PNG</text><text x="102" y="834" class="body">浏览器通过 API 读取结果</text></g><g><rect x="548" y="252" width="344" height="104" rx="16" class="card"/>
    <rect x="548" y="270" width="3" height="28" rx="1.5" fill="var(--teal)"/>
    <text x="570" y="282" class="teal">DEPLOYMENT</text><text x="570" y="315" class="card-title">Caddy · HTTPS 代理</text>
    </g><g><rect x="548" y="412" width="344" height="142" rx="16" class="card"/>
    <rect x="548" y="430" width="3" height="28" rx="1.5" fill="var(--teal)"/>
    <text x="570" y="442" class="teal">NODE.JS 24</text><text x="570" y="475" class="card-title">HTTP API 与授权</text>
    <text x="570" y="506" class="body">会话 / CSRF / RBAC</text><text x="570" y="531" class="body">企业隔离 / 请求与配额校验</text></g><g><rect x="548" y="610" width="344" height="104" rx="16" class="card"/>
    <rect x="548" y="628" width="3" height="28" rx="1.5" fill="var(--teal)"/>
    <text x="570" y="640" class="teal">PERSISTENT FIFO</text><text x="570" y="673" class="card-title">SQLite 任务队列</text>
    </g><g><rect x="548" y="770" width="344" height="104" rx="16" class="card"/>
    <rect x="548" y="788" width="3" height="28" rx="1.5" fill="var(--teal)"/>
    <text x="570" y="800" class="teal">WORKER THREAD</text><text x="570" y="833" class="card-title">独立分析线程</text>
    </g><g><rect x="1016" y="412" width="344" height="142" rx="16" class="card"/>
    <rect x="1016" y="430" width="3" height="28" rx="1.5" fill="var(--purple)"/>
    <text x="1038" y="442" class="purple">SQLITE / WAL</text><text x="1038" y="475" class="card-title">业务记录与审计</text>
    <text x="1038" y="506" class="body">企业 / 用户 / 项目 / 任务</text><text x="1038" y="531" class="body">复核记录 / 审计哈希链</text></g><g><rect x="1016" y="610" width="344" height="104" rx="16" class="card"/>
    <rect x="1016" y="628" width="3" height="28" rx="1.5" fill="var(--teal)"/>
    <text x="1038" y="640" class="teal">IMMUTABLE INPUT</text><text x="1038" y="673" class="card-title">体数据 · SHA-256</text>
    </g><g><rect x="1016" y="770" width="344" height="104" rx="16" class="card"/>
    <rect x="1016" y="788" width="3" height="28" rx="1.5" fill="var(--teal)"/>
    <text x="1038" y="800" class="teal">VERSIONED OUTPUT</text><text x="1038" y="833" class="card-title">报告 / 标签 / ROI / 点云</text>
    </g><path d="M424 304 H548" class="edge" marker-end="url(#arrow)"/><text x="458" y="291" class="edge-label">HTTPS</text><path d="M720 356 V412" class="edge" marker-end="url(#arrow)"/><path d="M892 480 H1016" class="edge" marker-end="url(#arrow)"/><text x="916" y="466" class="edge-label">事务 / 查询</text><path d="M548 526 H488 V550 H424" class="edge" marker-end="url(#arrow)"/><path d="M720 554 V610" class="edge" marker-end="url(#arrow)"/><text x="735" y="586" class="edge-label">提交任务</text><path d="M720 714 V770" class="edge" marker-end="url(#arrow)"/><text x="735" y="746" class="edge-label">取消 / 超时</text><path d="M1016 662 H954 V800 H892" class="edge" marker-end="url(#arrow)"/><text x="906" y="648" class="edge-label">校验输入</text><path d="M892 838 H1016" class="edge" marker-end="url(#arrow)"/><text x="923" y="824" class="edge-label">写入结果</text>
  <path d="M60 916 H1380" stroke="#27384f"/>
  <text x="60" y="953" class="footer">RAW 分块读取与区域采样 · 独立线程分析 · 结果复核与追溯 · Docker / HTTPS 部署</text><text x="1225" y="953" class="tag">VOXELSCOPE 1.0</text>
</svg>
